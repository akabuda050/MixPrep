# MixPrep model manifest
#
# Three embedding models, many classification heads.
#
# discogs-effnet: primary embedding — fast, 18MB, powers most heads.
# maest:          best genre accuracy — 348MB transformer, 519 styles.
# msd-musicnn:    needed for arousal head only.

models:

  # ── Embeddings ───────────────────────────────────────────────────────────────

  essentia-discogs-effnet:
    url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.pb"
    framework: tensorflow
    description: "Primary embedding — EfficientNet, 2M+ Discogs tracks, 400 styles"

  essentia-discogs-effnet-labels:
    url: "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs-effnet-bs64-1.json"
    framework: json
    description: "Label metadata for discogs-effnet — 400 Discogs style names"

  essentia-maest:
    url: "https://essentia.upf.edu/models/feature-extractors/maest/discogs-maest-30s-pw-519l-2.pb"
    framework: tensorflow
    description: "MAEST transformer — 4M tracks, 519 Discogs styles, best genre accuracy"

  essentia-maest-labels:
    url: "https://essentia.upf.edu/models/feature-extractors/maest/discogs-maest-30s-pw-519l-2.json"
    framework: json
    description: "Label metadata for MAEST — 519 Discogs style names"

  essentia-msd-musicnn:
    url: "https://essentia.upf.edu/models/autotagging/msd/msd-musicnn-1.pb"
    framework: tensorflow
    description: "MSD-MusiCNN embedding — required for arousal head"

  # ── Genre heads (discogs-effnet) ─────────────────────────────────────────────

  essentia-genre-jamendo:
    url: "https://essentia.upf.edu/models/classification-heads/mtg_jamendo_genre/mtg_jamendo_genre-discogs-effnet-1.pb"
    framework: tensorflow
    description: "MTG-Jamendo genre — 87 genre tags (house, techno, ambient, etc.)"

  essentia-genre-jamendo-labels:
    url: "https://essentia.upf.edu/models/classification-heads/mtg_jamendo_genre/mtg_jamendo_genre-discogs-effnet-1.json"
    framework: json
    description: "Label metadata for MTG-Jamendo genre — 87 class names"

  # ── Sound character heads (discogs-effnet) ───────────────────────────────────

  essentia-tonal-atonal:
    url: "https://essentia.upf.edu/models/classification-heads/tonal_atonal/tonal_atonal-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Tonal vs atonal (binary)"

  essentia-timbre:
    url: "https://essentia.upf.edu/models/classification-heads/timbre/timbre-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Bright vs dark timbre (binary)"

  essentia-approachability:
    url: "https://essentia.upf.edu/models/classification-heads/approachability/approachability_regression-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Approachability regression — mainstream vs niche [0-1]"

  essentia-engagement:
    url: "https://essentia.upf.edu/models/classification-heads/engagement/engagement_regression-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Engagement regression — active vs background listening [0-1]"

  # ── Voice / instrumentation heads (discogs-effnet) ───────────────────────────

  essentia-voice-instrumental:
    url: "https://essentia.upf.edu/models/classification-heads/voice_instrumental/voice_instrumental-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Voice vs instrumental (binary)"

  essentia-danceability:
    url: "https://essentia.upf.edu/models/classification-heads/danceability/danceability-discogs-effnet-1.pb"
    framework: tensorflow
    description: "Danceability — danceable vs not (binary)"

  # ── MSD-MusiCNN heads ────────────────────────────────────────────────────────

  essentia-arousal-valence-muse:
    url: "https://essentia.upf.edu/models/classification-heads/muse/muse-msd-musicnn-1.pb"
    framework: tensorflow
    description: "Arousal + valence regression [1-9] — MuSe dataset"

