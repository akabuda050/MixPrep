<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MixPrep</title>
<style>
:root {
  --bg:      #0c0c0c;
  --s1:      #111;
  --s2:      #161616;
  --s3:      #1c1c1c;
  --b1:      #202020;
  --b2:      #2a2a2a;
  --accent:  #e8b84b;
  --acc-d:   rgba(232,184,75,.10);
  --teal:    #4ec9b0;
  --text:    #d0d0d0;
  --t2:      #777;
  --t3:      #3a3a3a;
  --green:   #4ecf82;
  --r:       6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.5 'Inter',system-ui,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* ─── topbar ─── */
#topbar{
  height:46px;min-height:46px;
  background:var(--s1);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  flex-shrink:0;z-index:40;
}
#logo{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;flex-shrink:0}
#lib-crumb{display:flex;align-items:center;gap:6px;flex-shrink:0}
#lib-crumb-sep{color:var(--t3);font-size:14px}
#lib-crumb-name{font-size:12px;font-weight:600;color:var(--text)}
#change-lib{background:none;border:1px solid var(--b2);border-radius:4px;color:var(--t2);cursor:pointer;font-size:10px;padding:2px 8px;text-transform:uppercase;letter-spacing:.05em;transition:all .12s}
#change-lib:hover{border-color:var(--accent);color:var(--accent)}
#search{background:var(--s2);border:1px solid var(--b1);border-radius:5px;color:var(--text);padding:5px 11px;font-size:12px;flex:1;min-width:0;outline:none;transition:border-color .15s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--t3)}
#stats{color:var(--t2);font-size:11px;flex-shrink:0;white-space:nowrap}

/* ─── screens ─── */
.screen{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ─── library picker — split ─── */
#picker{flex-direction:row;overflow:hidden}

/* left: library list */
#lib-panel{
  display:flex;flex-direction:column;
  width:280px;min-width:200px;flex-shrink:0;
  border-right:1px solid var(--b1);overflow:hidden;
}
#lib-panel-bar{
  display:flex;align-items:center;
  background:var(--s1);border-bottom:1px solid var(--b1);
  padding:0 12px;height:34px;flex-shrink:0;
}
#lib-panel-bar span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t2)}
#lib-search{
  background:var(--s2);border:none;border-bottom:1px solid var(--b1);
  color:var(--text);padding:8px 14px;font-size:12px;
  width:100%;outline:none;flex-shrink:0;
}
#lib-search::placeholder{color:var(--t3)}
#lib-list{overflow-y:auto;flex:1}
.lib-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--b1);
  cursor:pointer;transition:background .08s;gap:8px;
}
.lib-row:hover{background:var(--s2)}
.lib-row.selected{background:var(--s3);border-left:2px solid var(--accent)}
.lib-row-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-row-count{font-size:10px;color:var(--t2);flex-shrink:0}
#picker-empty{color:var(--t2);text-align:center;padding:40px 14px;line-height:1.8;font-size:12px}
#picker-empty code{color:var(--accent);font-family:'SF Mono','Fira Code',monospace;font-size:11px}

/* right: library detail */
#lib-detail{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
#lib-detail-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--t3);font-size:13px;
}
#lib-detail-content{padding:28px;display:flex;flex-direction:column;gap:20px}
.ld-name{font-size:22px;font-weight:700;color:var(--text)}
.ld-chips{display:flex;gap:10px;flex-wrap:wrap}
.ld-chip{
  background:var(--s1);border:1px solid var(--b1);border-radius:5px;
  padding:8px 14px;display:flex;flex-direction:column;gap:3px;min-width:80px;
}
.ld-chip-label{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.1em}
.ld-chip-val{font-size:16px;font-weight:700;color:var(--text);line-height:1}
.ld-section{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:16px}
.ld-section-title{font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.ld-genres{display:flex;flex-wrap:wrap;gap:6px}
.ld-genre{background:rgba(80,90,200,.12);border:1px solid rgba(80,90,200,.2);border-radius:4px;color:#8898d8;font-size:11px;font-weight:500;padding:3px 10px}
.ld-keys{display:flex;flex-wrap:wrap;gap:6px}
.browse-btn{
  align-self:flex-start;
  background:var(--accent);border:none;border-radius:6px;
  color:#000;cursor:pointer;font-size:12px;font-weight:700;
  padding:10px 24px;letter-spacing:.04em;
  transition:opacity .12s;
}
.browse-btn:hover{opacity:.85}


/* ─── mixer bar ─── */
#mixer{
  display:flex;align-items:stretch;
  background:var(--s1);border-top:1px solid var(--b1);
  min-height:110px;flex-shrink:0;
}
.deck{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:8px 12px;gap:5px;min-width:0;overflow:hidden;
}
.deck-top{display:flex;align-items:center;gap:8px;min-width:0}
.deck-top .deck-artist{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-bottom{display:flex;align-items:flex-start;gap:0;min-width:0}
.deck-a .deck-bottom{flex-direction:row}
.deck-b .deck-bottom{flex-direction:row-reverse}
.deck-bottom .deck-controls{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.deck-bottom .deck-eq{flex-shrink:0;border-left:1px solid var(--b1);padding-left:12px;margin-left:8px}
.deck-b .deck-bottom .deck-eq{border-left:none;border-right:1px solid var(--b1);padding-left:0;padding-right:12px;margin-left:0;margin-right:8px}
/* EQ knobs */
.deck-eq{display:flex;align-items:center;gap:10px;flex-shrink:0}
.eq-band{display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none}
.eq-label{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.eq-val{font-size:8px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:24px;text-align:center}
.eq-knob{width:32px;height:32px;cursor:ns-resize;flex-shrink:0;touch-action:none}
.deck-a{ border-right:1px solid var(--b1); }
.deck-b{ border-left:1px solid var(--b1); }
.deck-label{
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  flex-shrink:0;
}
.deck-a .deck-label{ color:#4e9fd4; }
.deck-b .deck-label{ color:#c47ed4; }
.deck-title{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.deck-artist{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.deck-controls{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.deck-play{
  width:26px;height:26px;min-width:26px;flex-shrink:0;
  background:var(--s3);border:1px solid var(--b2);border-radius:50%;
  color:var(--text);cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;
  transition:all .1s;
}
.deck-play:hover{border-color:var(--accent);color:var(--accent)}
.deck-play.playing{background:var(--accent);border-color:var(--accent);color:#000}
.deck-progress{flex:1;height:4px;background:var(--b2);border-radius:2px;cursor:pointer;position:relative;min-width:40px}
.deck-progress-fill{height:100%;border-radius:2px;width:0%}
.deck-a .deck-progress-fill{background:#4e9fd4}
.deck-b .deck-progress-fill{background:#c47ed4}
.deck-time{font-size:9px;color:var(--t3);font-variant-numeric:tabular-nums;flex-shrink:0;white-space:nowrap}
.deck-vol{
  -webkit-appearance:none;appearance:none;
  width:50px;height:3px;background:var(--b2);border-radius:2px;cursor:pointer;outline:none;flex-shrink:0;
}
.deck-vol::-webkit-slider-thumb{
  -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
  background:var(--t2);cursor:pointer;
}
.deck-empty{font-size:11px;color:var(--t3);font-style:italic}
.deck-bpm{font-size:10px;color:var(--t2);flex-shrink:0;font-variant-numeric:tabular-nums;min-width:44px}
.deck-bpm.synced{color:var(--accent)}
.deck-sync{
  background:none;border:1px solid var(--b2);border-radius:3px;
  color:var(--t3);cursor:pointer;font-size:9px;font-weight:700;
  padding:2px 7px;letter-spacing:.06em;text-transform:uppercase;
  flex-shrink:0;transition:all .1s;
}
.deck-sync:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.deck-sync.active{border-color:var(--accent);color:var(--accent);background:var(--acc-d)}
.deck-sync:disabled{opacity:.3;cursor:default}
.deck-tempo{
  -webkit-appearance:none;appearance:none;
  width:60px;height:3px;background:var(--b2);border-radius:2px;cursor:pointer;outline:none;flex-shrink:0;
}
.deck-tempo::-webkit-slider-thumb{
  -webkit-appearance:none;width:9px;height:9px;border-radius:50%;
  background:var(--t2);cursor:pointer;
}
.deck-a .deck-tempo::-webkit-slider-thumb:hover{background:#4e9fd4}
.deck-b .deck-tempo::-webkit-slider-thumb:hover{background:#c47ed4}
.deck-tempo::-moz-range-thumb{width:9px;height:9px;border:none;border-radius:50%;background:var(--t2);cursor:pointer}

/* crossfader center section */
#xfader-wrap{
  width:160px;min-width:120px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px 12px;
}
#xfader-labels{display:flex;justify-content:space-between;width:100%}
#xfader-labels span{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
#xfader-labels .xl-a{color:#4e9fd4}
#xfader-labels .xl-b{color:#c47ed4}
#xfader{
  -webkit-appearance:none;appearance:none;
  width:100%;height:4px;background:var(--b2);border-radius:2px;cursor:pointer;outline:none;
}
#xfader::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--text);cursor:pointer;border:2px solid var(--bg);
  box-shadow:0 0 0 1px var(--b2);transition:background .1s;
}
#xfader::-webkit-slider-thumb:hover{background:var(--accent)}
#xfader::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--bg);border-radius:50%;background:var(--text);cursor:pointer}
#xfader-reset{
  background:none;border:1px solid var(--b2);border-radius:3px;
  color:var(--t3);cursor:pointer;font-size:9px;padding:2px 8px;
  text-transform:uppercase;letter-spacing:.06em;transition:all .1s;
}
#xfader-reset:hover{border-color:var(--b2);color:var(--t2)}

/* settings gear button — hidden on desktop, shown via media query on mobile */
.deck-settings-btn{
  display:none;
  background:none;border:1px solid var(--b2);border-radius:4px;
  color:var(--t2);cursor:pointer;font-size:13px;padding:2px 6px;flex-shrink:0;
  transition:all .1s;
}
.deck-settings-btn:hover{border-color:var(--accent);color:var(--accent)}

/* assign buttons in detail panel */
.d-assign{display:flex;gap:8px;flex-shrink:0}
.d-assign-btn{
  border:none;border-radius:5px;cursor:pointer;
  font-size:11px;font-weight:700;letter-spacing:.08em;
  padding:6px 16px;transition:opacity .12s;
}
.d-assign-btn.btn-a{background:rgba(78,159,212,.18);color:#4e9fd4;border:1px solid rgba(78,159,212,.3)}
.d-assign-btn.btn-b{background:rgba(196,126,212,.18);color:#c47ed4;border:1px solid rgba(196,126,212,.3)}
.d-assign-btn:hover{opacity:.75}
.d-assign-btn.assigned{opacity:1;filter:brightness(1.3)}

/* ─── tracks view: split ─── */
#tracks{flex-direction:row;overflow:hidden}

/* left: table */
#table-wrap{
  display:flex;flex-direction:column;
  width:55%;min-width:320px;min-height:0;
  border-right:1px solid var(--b1);
  overflow:hidden;
}

/* sort/column bar */
#col-bar{
  display:flex;align-items:stretch;
  background:var(--s1);border-bottom:1px solid var(--b1);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
#col-bar::-webkit-scrollbar{display:none}
.col-hdr{
  background:none;border:none;border-right:1px solid var(--b1);
  color:var(--t2);cursor:pointer;font-size:10px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;padding-top:7px;padding-bottom:7px;
  white-space:nowrap;flex-shrink:0;display:flex;align-items:center;
  justify-content:flex-end;gap:4px;transition:color .12s;
}
.col-hdr.col-identity{justify-content:flex-start}
.col-hdr:last-child{border-right:none}
.col-hdr:hover{color:var(--text)}
.col-hdr.active{color:var(--accent)}
.col-hdr .arrow{font-size:9px;opacity:.7}

/* track list */
#track-list{overflow-y:auto;flex:1}
.track-row{
  display:flex;align-items:center;
  border-bottom:1px solid var(--b1);
  cursor:pointer;padding:0 12px;height:40px;
  transition:background .08s;gap:0;
}
.track-row:hover{background:var(--s2)}
.track-row.selected{background:var(--s3);border-left:2px solid var(--accent)}
.track-row.selected .tr-artist,.track-row.selected .tr-title{color:var(--text)}
.track-row.deck-a-loaded{border-left:3px solid #4e9fd4;background:rgba(78,159,212,.07)}
.track-row.deck-b-loaded{border-left:3px solid #c47ed4;background:rgba(196,126,212,.07)}
.track-row.deck-a-loaded.deck-b-loaded{border-left:3px solid #4e9fd4;background:linear-gradient(90deg,rgba(78,159,212,.1),rgba(196,126,212,.1))}

.tr-identity{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-right:10px}
.tr-title{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.tr-artist{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}

.tr-cell{font-size:11px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:flex-end}
.tr-cell.dim{color:var(--t2);font-weight:400}
.camelot-sm{
  display:inline-block;background:rgba(78,207,130,.09);border:1px solid rgba(78,207,130,.2);
  border-radius:3px;color:var(--green);font-size:10px;font-weight:700;padding:0 5px;line-height:1.6;
}
.mini-bar-wrap{display:flex;flex-direction:column;justify-content:center}
.mini-bar-wrap .mini-val{font-size:10px;font-weight:600;text-align:right}
.mini-bar{background:var(--b1);border-radius:1px;height:3px;overflow:hidden;margin-top:3px}
.mini-bar-fill{height:100%;border-radius:1px}

/* shared column widths — same class on both col-hdr and track-row cells */
.col-identity{flex:1;min-width:120px;padding-left:12px;padding-right:4px}
.col-bpm    {width:68px;flex-shrink:0;box-sizing:border-box;padding:0 10px}
.col-key    {width:62px;flex-shrink:0;box-sizing:border-box;padding:0 8px}
.col-energy {width:80px;flex-shrink:0;box-sizing:border-box;padding:0 10px}

#load-more-row{
  padding:14px;text-align:center;border-top:1px solid var(--b1);
  flex-shrink:0;
}
#load-more-row button{
  background:none;border:1px solid var(--b2);border-radius:5px;color:var(--t2);
  cursor:pointer;font-size:11px;padding:6px 22px;text-transform:uppercase;letter-spacing:.06em;transition:all .12s
}
#load-more-row button:hover{border-color:var(--accent);color:var(--accent)}
#load-more-row .lm-count{color:var(--t3);font-size:10px;display:block;margin-top:4px}

/* right: detail panel */
#detail{
  flex:1;min-width:0;min-height:0;overflow-y:auto;
  background:var(--bg);
}
#detail-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--t3);font-size:13px;
}
#detail-content{padding:24px;display:flex;flex-direction:column;gap:20px}

.d-title{font-size:20px;font-weight:700;color:var(--text);line-height:1.2}
.d-artist{font-size:13px;color:var(--teal);margin-top:4px}

.d-meta{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.d-chip{
  background:var(--s1);border:1px solid var(--b1);border-radius:5px;
  padding:8px 14px;display:flex;flex-direction:column;gap:4px;min-width:72px;
}
.d-chip-label{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:.1em}
.d-chip-val{font-size:15px;font-weight:700;color:var(--text);line-height:1}


.d-section-title{font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.d-section{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:16px}

.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.score-row{display:flex;flex-direction:column;gap:5px}
.score-head{display:flex;justify-content:space-between;align-items:baseline}
.score-name{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.score-val{font-size:12px;font-weight:700;color:var(--text)}
.bar{background:var(--b1);border-radius:2px;height:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}

.genres{display:flex;flex-wrap:wrap;gap:6px}
.g-tag{background:rgba(80,90,200,.12);border:1px solid rgba(80,90,200,.2);border-radius:4px;color:#8898d8;font-size:11px;font-weight:500;padding:3px 10px}

.msg-full{color:var(--t2);text-align:center;padding:60px 20px;font-size:13px}

/* ─── mobile deck settings modal ─── */
#deck-modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  align-items:flex-end;justify-content:center;
}
#deck-modal-overlay.open{display:flex}
#deck-modal{
  background:var(--s1);border:1px solid var(--b1);border-radius:12px 12px 0 0;
  width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:14px;
}
#deck-modal-header{display:flex;align-items:center;justify-content:space-between}
#deck-modal-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#deck-modal-close{
  background:none;border:none;color:var(--t2);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;
}
#deck-modal-eq{display:flex;justify-content:center;gap:24px}
.modal-eq-band{display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none}
.modal-eq-label{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
.modal-eq-val{font-size:10px;color:var(--t2);font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.modal-eq-knob{width:52px;height:52px;cursor:ns-resize;touch-action:none}
#deck-modal-tempo{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--b1);padding-top:12px}
#deck-modal-tempo-row{display:flex;align-items:center;gap:10px}
#deck-modal-tempo label{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#deck-modal-tempo-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--b2);border-radius:2px;outline:none}
#deck-modal-tempo-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);cursor:pointer}
#deck-modal-tempo-slider::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--text);cursor:pointer}
#deck-modal-bpm{font-size:11px;font-variant-numeric:tabular-nums;min-width:46px;text-align:right;color:var(--t2)}
#deck-modal-sync-row{display:flex;gap:8px}
.modal-btn{
  flex:1;background:none;border:1px solid var(--b2);border-radius:5px;
  color:var(--t2);cursor:pointer;font-size:11px;font-weight:700;
  padding:6px 0;text-transform:uppercase;letter-spacing:.06em;
}
.modal-btn:active{background:var(--b2)}

/* ─── mobile back btn ─── */
#back-btn{
  display:none;background:none;border:none;color:var(--accent);
  cursor:pointer;font-size:12px;font-weight:600;padding:0;
  align-items:center;gap:5px;letter-spacing:.03em;flex-shrink:0;
}
#back-btn::before{content:'←';font-size:14px}


@media(max-width:640px){

<script>
const PAGE_SIZE = 50;
let profiles  = [];
let sortKey   = 'artist';
let sortAsc   = true;
let query     = '';
let visible   = PAGE_SIZE;
let selected  = null;
let currentLibrary = null;

// ── Camelot wheel sort position ──
function camelotPos(c) {
  if (!c) return -1;
  const m = c.match(/^(\d+)([AB])$/i);
  if (!m) return -1;
  return (parseInt(m[1], 10) - 1) * 2 + (m[2].toUpperCase() === 'B' ? 1 : 0);
}

const SCORE_COLOR = {
  energy:'#d48040', groove:'#40a8d4', danceability:'#b860b8',
  arousal:'#d44040', tonal:'#b8b840', timbre_bright:'#40b8b8',
  approachability:'#b84080', engagement:'#6060c0',
};
const PHASE_COLOR = {
  warmup_score:'#4ecf80', build_score:'#6090cf',
  peak_score:'#cf6060', reset_score:'#b8b84a', winddown_score:'#4ab8b8',
};

function pct(v)    { return v == null ? '—' : Math.round(v * 100) + '%'; }
function pctN(v)   { return v == null ? 0 : Math.round(v * 100); }
function fmtBpm(v) { return v == null ? '—' : v.toFixed(1); }
function fmtDur(s) {
  if (s == null) return '—';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Sort ──
function sortVal(p, key) {
  switch (key) {
    case 'artist':          return (p.artist||'').toLowerCase()+'\0'+(p.title||'').toLowerCase();
    case 'title':           return (p.title||'').toLowerCase();
    case 'bpm':             return p.bpm              ?? -1;
    case 'camelot':         return camelotPos(p.camelot);
    case 'energy':          return p.energy            ?? -1;
    case 'groove':          return p.groove            ?? -1;
    case 'danceability':    return p.danceability      ?? -1;
    case 'arousal':         return p.arousal           ?? -1;
    case 'tonal':           return p.tonal             ?? -1;
    case 'timbre':          return p.timbre_bright      ?? -1;
    case 'approachability': return p.approachability   ?? -1;
    case 'engagement':      return p.engagement        ?? -1;
    case 'warmup':          return p.warmup_score      ?? -1;
    case 'build':           return p.build_score       ?? -1;
    case 'peak':            return p.peak_score        ?? -1;
    case 'reset':           return p.reset_score       ?? -1;
    case 'winddown':        return p.winddown_score    ?? -1;
    default: return 0;
  }
}

function filteredSorted() {
  const q = query.toLowerCase();
  const list = profiles.filter(p =>
    !q || (p.artist||'').toLowerCase().includes(q) || (p.title||'').toLowerCase().includes(q)
  );
  list.sort((a, b) => {
    const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
    const cmp = typeof av === 'string' ? (av < bv ? -1 : av > bv ? 1 : 0) : av - bv;
    return sortAsc ? cmp : -cmp;
  });
  return list;
}

// ── Track row ──
function renderRow(p) {
  const title  = esc(p.title  || p.track_id);
  const artist = p.artist ? esc(p.artist) : '<span style="color:var(--t3)">N/A</span>';
  const bpm    = fmtBpm(p.bpm);
  const key    = p.camelot ? `<span class="camelot-sm">${p.camelot}</span>` : '<span style="color:var(--t3)">—</span>';
  const en = pctN(p.energy);

  function miniBar(cls, val, n, color) {
    return `<div class="mini-bar-wrap ${cls}">
      <div class="mini-val" style="color:${val==null?'var(--t3)':'var(--text)'}">${pct(val)}</div>
      <div class="mini-bar"><div class="mini-bar-fill" style="width:${n}%;background:${color}"></div></div>
    </div>`;
  }

  return `<div class="track-row" data-id="${esc(p.track_id)}">
  <div class="tr-identity col-identity">
    <div class="tr-title">${title}</div>
    <div class="tr-artist">${artist}</div>
  </div>
  <div class="tr-cell col-bpm ${p.bpm==null?'dim':''}">${bpm}</div>
  <div class="tr-cell col-key">${key}</div>
  ${miniBar('col-energy', p.energy, en, '#d48040')}
</div>`;
}

const TOOLTIPS = {
  energy:          'Overall intensity — how hard and exciting the track hits.',
  groove:          'How much the track pulls you in and makes you move.',
  danceability:    'How well the track works on a dancefloor.',
  arousal:         'Perceived excitement and stimulation level.',
  tonal:           'How melodic and harmonically rich the track is.',
  timbre_bright:   'Brightness of the sound — high means lots of highs and presence.',
  approachability: 'How easy and welcoming the track feels to a listener.',
  engagement:      'How much the track holds attention and creates emotional connection.',
  warmup_score:    'How well this track fits the opening of a set.',
  build_score:     'How well this track works for building energy mid-set.',
  peak_score:      'How well this track fits the peak / climax of a set.',
  reset_score:     'How well this track works as a breakdown to drop energy.',
  winddown_score:  'How well this track fits closing a set.',
};

// ── Detail panel ──
function scoreRow(label, key, val, colorMap) {
  const color   = colorMap[key] || '#666';
  const tooltip = TOOLTIPS[key] ? ` title="${TOOLTIPS[key]}"` : '';
  return `<div class="score-row">
    <div class="score-head">
      <span class="score-name" style="cursor:default"${tooltip}>${label}</span>
      <span class="score-val">${pct(val)}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pctN(val)}%;background:${color}"></div></div>
  </div>`;
}

function renderDetail(p) {
  const title  = esc(p.title  || p.track_id);
  const artist = p.artist ? esc(p.artist) : null;
  const camelot = p.camelot
    ? `<span class="camelot-sm" style="font-size:15px;padding:1px 8px">${p.camelot}</span>`
    : '<span style="color:var(--t3)">—</span>';
  const genres = (p.genres||[]).map(g=>`<span class="g-tag">${esc(g.label)}</span>`).join('');

  return `
  <div class="d-identity">
    <div class="d-title">${title}</div>
    ${artist ? `<div class="d-artist">${artist}</div>` : '<div class="d-artist" style="color:var(--t3)">N/A</div>'}
    <div class="d-meta">
      <div class="d-chip"><span class="d-chip-label">Key</span><span class="d-chip-val">${camelot}</span></div>
      <div class="d-chip"><span class="d-chip-label">BPM</span><span class="d-chip-val">${fmtBpm(p.bpm)}</span></div>
      <div class="d-chip"><span class="d-chip-label">Duration</span><span class="d-chip-val">${fmtDur(p.duration)}</span></div>
    </div>
  </div>

  <div class="d-assign" data-track-id="${esc(p.track_id)}" data-src="/api/audio/${encodeURIComponent(currentLibrary)}/${encodeURIComponent(p.track_id)}">
    <button class="d-assign-btn btn-a" data-deck="a">Load → A</button>
    <button class="d-assign-btn btn-b" data-deck="b">Load → B</button>
  </div>

  <div class="d-section">
    <div class="d-section-title">Audio profile</div>
    <div class="score-grid">
      ${scoreRow('Energy',      'energy',          p.energy,          SCORE_COLOR)}
      ${scoreRow('Groove',      'groove',          p.groove,          SCORE_COLOR)}
      ${scoreRow('Danceability','danceability',    p.danceability,    SCORE_COLOR)}
      ${scoreRow('Arousal',     'arousal',         p.arousal,         SCORE_COLOR)}
      ${scoreRow('Tonal',       'tonal',           p.tonal,           SCORE_COLOR)}
      ${scoreRow('Timbre',      'timbre_bright',   p.timbre_bright,   SCORE_COLOR)}
      ${scoreRow('Approach',    'approachability', p.approachability, SCORE_COLOR)}
      ${scoreRow('Engagement',  'engagement',      p.engagement,      SCORE_COLOR)}
    </div>
  </div>

  <div class="d-section">
    <div class="d-section-title">Phase suitability</div>
    <div class="score-grid">
      ${scoreRow('Warm-up',   'warmup_score',   p.warmup_score,   PHASE_COLOR)}
      ${scoreRow('Build',     'build_score',    p.build_score,    PHASE_COLOR)}
      ${scoreRow('Peak',      'peak_score',     p.peak_score,     PHASE_COLOR)}
      ${scoreRow('Reset',     'reset_score',    p.reset_score,    PHASE_COLOR)}
      ${scoreRow('Wind-down', 'winddown_score', p.winddown_score, PHASE_COLOR)}
    </div>
  </div>

  ${genres ? `<div class="d-section"><div class="d-section-title">Genres</div><div class="genres">${genres}</div></div>` : ''}
  `;
}

// ── Render list ──
function render() {
  const list = filteredSorted();
  const slice = list.slice(0, visible);
  const remaining = list.length - slice.length;

  document.getElementById('stats').textContent = `${list.length} / ${profiles.length} tracks`;

  const trackList = document.getElementById('track-list');
  trackList.innerHTML = slice.length
    ? slice.map(renderRow).join('')
    : '<div class="msg-full">No tracks found.</div>';

  // re-attach row click listeners
  trackList.querySelectorAll('.track-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      const p = profiles.find(x => x.track_id === id);
      if (!p) return;
      selected = id;
      trackList.querySelectorAll('.track-row').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
      showDetail(p);
    });
    if (row.dataset.id === selected) row.classList.add('selected');
  });

  updateTrackListHighlight();

  const lmr = document.getElementById('load-more-row');
  if (remaining > 0) {
    lmr.classList.remove('hidden');
    lmr.innerHTML = `<button id="lm-btn">Load ${Math.min(PAGE_SIZE, remaining)} more</button>
      <span class="lm-count">${remaining} remaining</span>`;
    document.getElementById('lm-btn').addEventListener('click', () => { visible += PAGE_SIZE; render(); });
  } else {
    lmr.classList.add('hidden');
    lmr.innerHTML = '';
  }
}

function isMobile() { return window.innerWidth <= 640; }

// ── DJ Mixer engine ──
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

// Shared AudioContext — created once, reused for both decks
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// deck = { audio, src, bpm, gainNode, filters: {hi, mid, lo} }
const decks = {
  a: { audio: null, src: null, bpm: null, gainNode: null, filters: null },
  b: { audio: null, src: null, bpm: null, gainNode: null, filters: null },
};

function buildAudioChain(audioEl, id) {
  // 3-band crossover, steep rolloff via 3 cascaded filters per band (-36dB/oct).
  //   lo:  source → lp(250)×3  → loBoost  → loKill  → master
  //   mid: source → lp(3k)×3 → hp(250)×3 → midBoost → midKill → master
  //   hi:  source → hp(3k)×3  → hiBoost  → hiKill  → master
  const source = audioCtx.createMediaElementSource(audioEl);
  const master = audioCtx.createGain();
  master.connect(audioCtx.destination);

  // Build N cascaded filters of the same type/freq, return [first, last]
  function cascade(inputNode, type, freq, count) {
    let node = inputNode;
    for (let i = 0; i < count; i++) {
      const f = audioCtx.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      node.connect(f);
      node = f;
    }
    return node; // last filter in chain
  }

  function makeBranch(lastFilter, boostType, boostFreq) {
    const boost = audioCtx.createBiquadFilter();
    boost.type = boostType;
    boost.frequency.value = boostFreq;
    boost.gain.value = 0;
    const kill = audioCtx.createGain();
    kill.gain.value = 1;
    lastFilter.connect(boost);
    boost.connect(kill);
    kill.connect(master);
    return { boost, kill };
  }

  const loEnd  = cascade(source, 'lowpass',  250,  3);
  const midEnd = cascade(cascade(source, 'lowpass', 3000, 3), 'highpass', 250, 3);
  const hiEnd  = cascade(source, 'highpass', 3000, 3);

  const bands = {
    lo:  makeBranch(loEnd,  'lowshelf',  250),
    mid: makeBranch(midEnd, 'peaking',  1000),
    hi:  makeBranch(hiEnd,  'highshelf', 3000),
  };

  decks[id].gainNode = master;
  decks[id].filters  = bands;
}

// db: -12 = kill (full mute), 0 = flat, +12 = boost
// ── EQ Knobs ──
const EQ_MIN = -12, EQ_MAX = 12;
// knobState: canvas id → current db value
const knobState = {};

function drawKnob(canvas, db, deckId) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2, r = w / 2 - 3;
  ctx.clearRect(0, 0, w, h);

  const isKill = db <= EQ_MIN;
  const t = (db - EQ_MIN) / (EQ_MAX - EQ_MIN); // 0..1, 0.5 = center = 0dB

  // Angles: start at 7:30 (135°), end at 4:30 (405°=45°), center at 12 o'clock (270°)
  const startAngle  = (135 * Math.PI) / 180;
  const totalArc    = (270 * Math.PI) / 180; // 270° sweep
  const centerAngle = startAngle + totalArc / 2; // = 270° = 12 o'clock
  const angle = startAngle + t * totalArc;

  const trackColor = isKill ? '#d44e4e' : '#2a2a2a';
  const arcColor   = isKill ? '#d44e4e' : db > 0 ? '#e8b84b' : db < 0 ? '#4e9fd4' : '#444';
  const dotColor   = isKill ? '#d44e4e' : deckId === 'a' ? '#4e9fd4' : '#c47ed4';

  // Background track
  ctx.beginPath();
  ctx.arc(cx, cy, r, startAngle, startAngle + totalArc);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Center mark at 0dB
  ctx.beginPath();
  ctx.arc(cx, cy, r, centerAngle - 0.01, centerAngle + 0.01);
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Value arc from center to current position
  if (Math.abs(db) > 0.1) {
    ctx.beginPath();
    // db > 0: clockwise from center; db < 0: counter-clockwise from center
    ctx.arc(cx, cy, r, centerAngle, angle, db < 0);
    ctx.strokeStyle = arcColor;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Knob body
  ctx.beginPath();
  ctx.arc(cx, cy, r - 5, 0, Math.PI * 2);
  ctx.fillStyle = '#1c1c1c';
  ctx.fill();
  ctx.strokeStyle = isKill ? '#d44e4e' : '#333';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Indicator dot
  const dotR = r - 8;
  const dx = cx + dotR * Math.cos(angle);
  const dy = cy + dotR * Math.sin(angle);
  ctx.beginPath();
  ctx.arc(dx, dy, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = dotColor;
  ctx.fill();
}

function setEqBand(id, band, db) {
  db = Math.max(EQ_MIN, Math.min(EQ_MAX, db));
  knobState[`${id}-${band}`] = db;

  // Audio
  if (decks[id].filters) {
    const b = decks[id].filters[band];
    const isKill = db <= EQ_MIN;
    b.kill.gain.value  = isKill ? 0 : 1;
    b.boost.gain.value = isKill ? 0 : db;
  }

  // Draw knob
  const canvas = document.getElementById(`deck-${id}-${band}`);
  if (canvas) drawKnob(canvas, db, id);

  // Label
  const valEl = document.getElementById(`deck-${id}-${band}-val`);
  if (valEl) {
    const isKill = db <= EQ_MIN;
    valEl.textContent = isKill ? 'kill' : db === 0 ? '0' : db > 0 ? '+' + db : String(db);
    valEl.style.color = isKill ? '#d44e4e' : db !== 0 ? 'var(--text)' : 'var(--t2)';
  }
}

function initKnob(canvas, id, band) {
  let startY = null, startDb = null;
  knobState[`${id}-${band}`] = 0;
  drawKnob(canvas, 0, id);

  function onMove(clientY) {
    const dy = startY - clientY; // up = positive
    const sensitivity = 0.15;   // dB per pixel
    const db = Math.round((startDb + dy * sensitivity) * 2) / 2; // snap to 0.5
    setEqBand(id, band, db);
  }

  canvas.addEventListener('mousedown', e => {
    startY = e.clientY;
    startDb = knobState[`${id}-${band}`] ?? 0;
    e.preventDefault();
    const onUp   = () => { startY = null; window.removeEventListener('mousemove', onMv); window.removeEventListener('mouseup', onUp); };
    const onMv   = e => { if (startY !== null) onMove(e.clientY); };
    window.addEventListener('mousemove', onMv);
    window.addEventListener('mouseup', onUp);
  });

  canvas.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    startDb = knobState[`${id}-${band}`] ?? 0;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (startY !== null) onMove(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', () => { startY = null; });

  canvas.addEventListener('dblclick', () => setEqBand(id, band, 0));
}

// Crossfader: 0 = full A, 100 = full B, 50 = center (equal)
function xfaderVal() { return parseInt(document.getElementById('xfader').value, 10); }

function deckVolumes(xf) {
  // Equal-power crossfade curve
  const t = xf / 100;
  return {
    a: Math.cos(t * Math.PI / 2),
    b: Math.cos((1 - t) * Math.PI / 2),
  };
}

// Tracks which decks were paused by the crossfader reaching a hard cut.
// We only auto-resume decks that WE paused, not decks the user paused manually.
const xfPaused = { a: false, b: false };

function setDeckPlayUI(id, playing) {
  const btn = document.getElementById(`deck-${id}-play`);
  if (!btn) return;
  btn.textContent = playing ? '■' : '▶';
  btn.classList.toggle('playing', playing);
}

function applyXfader() {
  const xf = xfaderVal();
  const v = deckVolumes(xf);
  const volA = parseFloat(document.getElementById('deck-a-vol').value);
  const volB = parseFloat(document.getElementById('deck-b-vol').value);

  // Hard-cut thresholds: xf=0 → full A (cut B), xf=100 → full B (cut A)
  const cutB = xf === 0;
  const cutA = xf === 100;

  // Deck A
  if (decks.a.audio) {
    decks.a.audio.volume = v.a * volA;
    if (cutA && !decks.a.audio.paused) {
      decks.a.audio.pause();
      xfPaused.a = true;
      setDeckPlayUI('a', false);
    } else if (!cutA && xfPaused.a && decks.a.audio.paused) {
      decks.a.audio.play().catch(() => {});
      xfPaused.a = false;
      setDeckPlayUI('a', true);
    }
  }

  // Deck B
  if (decks.b.audio) {
    decks.b.audio.volume = v.b * volB;
    if (cutB && !decks.b.audio.paused) {
      decks.b.audio.pause();
      xfPaused.b = true;
      setDeckPlayUI('b', false);
    } else if (!cutB && xfPaused.b && decks.b.audio.paused) {
      decks.b.audio.play().catch(() => {});
      xfPaused.b = false;
      setDeckPlayUI('b', true);
    }
  }
}

function updateBpmDisplay(id) {
  const d = decks[id];
  const bpmEl  = document.getElementById(`deck-${id}-bpm`);
  const syncBtn = document.getElementById(`deck-${id}-sync`);
  const rstBtn  = document.getElementById(`deck-${id}-reset`);
  if (!d.bpm) {
    bpmEl.classList.add('hidden');
    syncBtn.classList.add('hidden');
    rstBtn.classList.add('hidden');
    return;
  }
  const effectiveBpm = d.bpm * (d.audio ? d.audio.playbackRate : 1);
  const isSynced = d.audio && Math.abs(d.audio.playbackRate - 1) > 0.001;
  bpmEl.classList.remove('hidden');
  bpmEl.textContent = effectiveBpm.toFixed(1);
  bpmEl.classList.toggle('synced', isSynced);
  syncBtn.classList.remove('hidden');
  rstBtn.classList.remove('hidden');
  rstBtn.classList.toggle('active', isSynced);
}

function syncDeck(id) {
  const otherId = id === 'a' ? 'b' : 'a';
  const d = decks[id];
  const other = decks[otherId];
  if (!d.audio || !d.bpm || !other.bpm) return;

  // 1. Match BPM
  const targetBpm = other.bpm * (other.audio ? other.audio.playbackRate : 1);
  d.audio.playbackRate = targetBpm / d.bpm;

  // 2. Beat-align phase: nudge currentTime so beats land together
  //    Beat period of master (in master's media time, accounting for playbackRate)
  if (other.audio && !other.audio.paused) {
    const masterBpm  = targetBpm;
    const masterPeriod = 60 / masterBpm; // seconds per beat in real time
    // Where is master in its beat cycle (real-time seconds elapsed since last beat)
    const masterPhase = (other.audio.currentTime / (other.audio.playbackRate > 0 ? other.audio.playbackRate : 1)) % masterPeriod;
    // Beat period in slave's media time
    const slavePeriod = 60 / d.bpm; // before playbackRate — media time per beat
    // Current phase of slave in media time
    const slavePhase  = d.audio.currentTime % slavePeriod;
    // Desired slave media-time phase = masterPhase (same fraction of beat)
    const desiredPhase = masterPhase * (d.bpm / masterBpm) * d.audio.playbackRate;
    // Nudge: difference between desired and current phase, rounded to nearest beat
    const phaseDiff = desiredPhase - slavePhase;
    // Keep nudge within ±half a beat to pick shortest path
    const nudge = phaseDiff - Math.round(phaseDiff / slavePeriod) * slavePeriod;
    const newTime = d.audio.currentTime + nudge;
    if (newTime >= 0 && newTime <= d.audio.duration) {
      d.audio.currentTime = newTime;
    }
  }

  const tempoEl = document.getElementById(`deck-${id}-tempo`);
  if (tempoEl) tempoEl.value = d.audio.playbackRate;
  updateBpmDisplay(id);
}

function resetDeckBpm(id) {
  const d = decks[id];
  if (!d.audio) return;
  d.audio.playbackRate = 1;
  const tempoEl = document.getElementById(`deck-${id}-tempo`);
  if (tempoEl) tempoEl.value = '1';
  updateBpmDisplay(id);
}

function loadDeck(id, src, title, artist, bpm) {
  const d = decks[id];

  // Stop previous and reset its UI
  if (d.audio) {
    d.audio.pause();
    d.audio.src = '';
    setDeckPlayUI(id, false);
  }
  // New track loaded manually — clear xfader-pause state for this deck
  xfPaused[id] = false;
  d.bpm = bpm || null;

  d.audio = new Audio();
  d.audio.preload = 'auto';
  d.audio.src = src;
  d.src = src;

  // Resume AudioContext if suspended (browser autoplay policy)
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Build Web Audio chain: source → lo → mid → hi → gain → out
  buildAudioChain(d.audio, id);

  // Reset EQ sliders and filters to 0 dB
  ['hi', 'mid', 'lo'].forEach(band => {
    const sl = document.getElementById(`deck-${id}-${band}`);
    if (sl) sl.value = '0';
    setEqBand(id, band, 0);
  });

  // Apply current xfader volume immediately
  applyXfader();

  // UI elements
  const playBtn = document.getElementById(`deck-${id}-play`);
  const fill    = document.getElementById(`deck-${id}-fill`);
  const prog    = document.getElementById(`deck-${id}-prog`);
  const timeEl  = document.getElementById(`deck-${id}-time`);
  const titleEl = document.getElementById(`deck-${id}-title`);
  const artistEl= document.getElementById(`deck-${id}-artist`);
  const emptyEl = document.getElementById(`deck-${id}-empty`);
  const volEl   = document.getElementById(`deck-${id}-vol`);

  // Show track info
  emptyEl.classList.add('hidden');
  titleEl.classList.remove('hidden');
  titleEl.textContent = title;
  if (artist) { artistEl.classList.remove('hidden'); artistEl.textContent = artist; }
  else        { artistEl.classList.add('hidden'); }

  d.audio.addEventListener('timeupdate', () => {
    const pct = d.audio.duration ? (d.audio.currentTime / d.audio.duration) * 100 : 0;
    fill.style.width = pct + '%';
    timeEl.textContent = fmtTime(d.audio.currentTime);
  });
  d.audio.addEventListener('ended', () => {
    playBtn.textContent = '▶';
    playBtn.classList.remove('playing');
    fill.style.width = '0%';
  });

  // Detach old listeners by replacing element clone trick isn't needed —
  // new audio object each time, old ones are GC'd. Just rebind play btn.
  const newPlay = playBtn.cloneNode(true);
  playBtn.parentNode.replaceChild(newPlay, playBtn);
  newPlay.addEventListener('click', () => {
    if (d.audio.paused) {
      d.audio.play();
      newPlay.textContent = '■'; newPlay.classList.add('playing');
    } else {
      d.audio.pause();
      newPlay.textContent = '▶'; newPlay.classList.remove('playing');
      // User manually paused — don't auto-resume on xfader move
      xfPaused[id] = false;
    }
  });

  prog.onclick = e => {
    if (!d.audio.duration) return;
    const r = prog.getBoundingClientRect();
    d.audio.currentTime = ((e.clientX - r.left) / r.width) * d.audio.duration;
  };

  volEl.oninput = () => applyXfader();

  // BPM / SYNC / RST / tempo
  const tempoEl = document.getElementById(`deck-${id}-tempo`);
  const syncBtn = document.getElementById(`deck-${id}-sync`);
  const rstBtn  = document.getElementById(`deck-${id}-reset`);

  tempoEl.value = '1';
  tempoEl.classList.toggle('hidden', !d.bpm);
  syncBtn.classList.toggle('hidden', !d.bpm);
  rstBtn.classList.toggle('hidden', !d.bpm);
  updateBpmDisplay(id);

  tempoEl.oninput = () => {
    if (!d.audio) return;
    d.audio.playbackRate = parseFloat(tempoEl.value);
    updateBpmDisplay(id);
  };

  syncBtn.onclick = () => syncDeck(id);

  rstBtn.onclick = () => {
    resetDeckBpm(id);
    tempoEl.value = '1';
  };

  // EQ knobs — init (attaches drag listeners) and reset to 0
  ['hi', 'mid', 'lo'].forEach(band => {
    const canvas = document.getElementById(`deck-${id}-${band}`);
    if (canvas) {
      initKnob(canvas, id, band);
      setEqBand(id, band, 0);
    }
  });

  // Don't auto-play — user presses play in the mixer
  updateTrackListHighlight();
}

function updateTrackListHighlight() {
  const trackIdA = decks.a.src ? new URL(decks.a.src, location.href).pathname.split('/').pop() : null;
  const trackIdB = decks.b.src ? new URL(decks.b.src, location.href).pathname.split('/').pop() : null;
  document.querySelectorAll('.track-row').forEach(row => {
    const id = decodeURIComponent(row.dataset.id);
    row.classList.toggle('deck-a-loaded', trackIdA ? decodeURIComponent(trackIdA) === id : false);
    row.classList.toggle('deck-b-loaded', trackIdB ? decodeURIComponent(trackIdB) === id : false);
  });
}

function updateAssignButtons(trackId) {
  // Mark [A]/[B] buttons for the currently viewed track as assigned or not
  const assign = document.querySelector('.d-assign');
  if (!assign || assign.dataset.trackId !== trackId) return;
  assign.querySelectorAll('.d-assign-btn').forEach(btn => {
    const deck = decks[btn.dataset.deck];
    const isCurrent = deck.src && new URL(deck.src, location.href).pathname === new URL(assign.dataset.src, location.href).pathname;
    btn.classList.toggle('assigned', isCurrent);
  });
}

function showDetail(p) {
  document.getElementById('detail-empty').classList.add('hidden');
  const dc = document.getElementById('detail-content');
  dc.classList.remove('hidden');
  dc.innerHTML = renderDetail(p);

  // Bind assign buttons
  dc.querySelectorAll('.d-assign-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const assign = btn.closest('.d-assign');
      const src    = assign.dataset.src;
      const id     = btn.dataset.deck;
      const title  = p.title || p.track_id;
      const artist = p.artist || null;
      loadDeck(id, src, title, artist, p.bpm || null);
      updateAssignButtons(p.track_id);
    });
  });
  updateAssignButtons(p.track_id);

  if (isMobile()) {
    document.getElementById('tracks').classList.add('detail-open');
    document.getElementById('back-btn').classList.remove('hidden');
    document.getElementById('lib-crumb').classList.add('hidden');
    window.scrollTo(0, 0);
  }
}

function closeDetail() {
  document.getElementById('tracks').classList.remove('detail-open');
  document.getElementById('back-btn').classList.add('hidden');
  document.getElementById('lib-crumb').classList.remove('hidden');
  selected = null;
  // Re-render so selected highlight clears and all rows are clickable fresh
  render();
}

// ── Col header sort ──
function updateColHeaders() {
  document.querySelectorAll('.col-hdr').forEach(h => {
    const active = h.dataset.sort === sortKey;
    h.classList.toggle('active', active);
    h.querySelector('.arrow').textContent = active ? (sortAsc ? '↑' : '↓') : '';
  });
}

// ── Library picker ──
let allLibs = [];       // [{name, count, profiles}]
let selectedLib = null;

function libAgg(ps) {
  // Aggregate stats from profile list
  const bpms    = ps.map(p => p.bpm).filter(v => v != null);
  const energies = ps.map(p => p.energy).filter(v => v != null);
  const keys    = {};
  ps.forEach(p => { if (p.camelot) keys[p.camelot] = (keys[p.camelot] || 0) + 1; });
  const topKeys = Object.entries(keys).sort((a,b) => b[1]-a[1]).slice(0,6).map(e => e[0]);
  const genreMap = {};
  ps.forEach(p => (p.genres||[]).forEach(g => {
    genreMap[g.label] = (genreMap[g.label] || 0) + g.score;
  }));
  const topGenres = Object.entries(genreMap).sort((a,b) => b[1]-a[1]).slice(0,8).map(e => e[0]);
  const avg = arr => arr.length ? arr.reduce((s,v) => s+v, 0) / arr.length : null;
  return {
    count: ps.length,
    bpmMin: bpms.length ? Math.round(Math.min(...bpms)) : null,
    bpmMax: bpms.length ? Math.round(Math.max(...bpms)) : null,
    avgEnergy: avg(energies),
    topKeys,
    topGenres,
  };
}

function renderLibDetail(lib) {
  const a = libAgg(lib.profiles);
  const bpmRange = a.bpmMin != null ? `${a.bpmMin} – ${a.bpmMax}` : '—';
  const energy   = a.avgEnergy != null ? Math.round(a.avgEnergy * 100) + '%' : '—';
  const keys     = a.topKeys.map(k =>
    `<span class="camelot-sm" style="font-size:11px">${k}</span>`).join('') || '<span style="color:var(--t3)">—</span>';
  const genres   = a.topGenres.map(g =>
    `<span class="ld-genre">${esc(g)}</span>`).join('') || '<span style="color:var(--t3)">—</span>';

  document.getElementById('lib-detail-empty').classList.add('hidden');
  const dc = document.getElementById('lib-detail-content');
  dc.classList.remove('hidden');
  dc.innerHTML = `
    <div class="ld-name">${esc(lib.name)}</div>
    <div class="ld-chips">
      <div class="ld-chip"><span class="ld-chip-label">Tracks</span><span class="ld-chip-val">${a.count}</span></div>
      <div class="ld-chip"><span class="ld-chip-label">BPM range</span><span class="ld-chip-val" style="font-size:13px">${bpmRange}</span></div>
      <div class="ld-chip"><span class="ld-chip-label">Avg energy</span><span class="ld-chip-val">${energy}</span></div>
    </div>
    <div class="ld-section">
      <div class="ld-section-title">Top keys</div>
      <div class="ld-keys">${keys}</div>
    </div>
    <div class="ld-section">
      <div class="ld-section-title">Top genres</div>
      <div class="ld-genres">${genres}</div>
    </div>
    <button class="browse-btn" id="browse-btn">Browse →</button>`;
  dc.querySelector('#browse-btn').addEventListener('click', () => enterLibrary(lib.name, lib.profiles));
}

function renderLibList(filterQ) {
  const listEl = document.getElementById('lib-list');
  const q = filterQ.toLowerCase().trim();
  const rows = q ? allLibs.filter(l => l.name.toLowerCase().includes(q)) : allLibs;
  if (!rows.length) {
    listEl.innerHTML = '<div class="msg-full" style="font-size:12px">No libraries match.</div>';
    return;
  }
  listEl.innerHTML = rows.map(l => `
    <div class="lib-row${selectedLib === l.name ? ' selected' : ''}" data-lib="${esc(l.name)}">
      <span class="lib-row-name">${esc(l.name)}</span>
      <span class="lib-row-count">${l.count === '…' ? '…' : l.count}</span>
    </div>`).join('');
  listEl.querySelectorAll('.lib-row').forEach(row => {
    row.addEventListener('click', () => {
      selectedLib = row.dataset.lib;
      listEl.querySelectorAll('.lib-row').forEach(r => r.classList.toggle('selected', r.dataset.lib === selectedLib));
      const lib = allLibs.find(l => l.name === selectedLib);
      if (lib && lib.profiles) renderLibDetail(lib);
    });
  });
}

async function loadLibraries() {
  const listEl  = document.getElementById('lib-list');
  const searchEl = document.getElementById('lib-search');
  selectedLib = null;
  searchEl.value = '';
  searchEl.classList.add('hidden');
  document.getElementById('lib-detail-empty').classList.remove('hidden');
  document.getElementById('lib-detail-content').classList.add('hidden');
  listEl.innerHTML = '<div class="msg-full" style="font-size:12px">Loading…</div>';
  try {
    const libs = await fetch('/api/libraries').then(r => r.json());
    if (!libs.length) {
      listEl.innerHTML = `<div id="picker-empty">
        No libraries found.<br>
        Run <code>mixprep scan &lt;dir&gt; --library &lt;name&gt;</code> first,<br>
        then <code>mixprep analyze --stage profile --library &lt;name&gt;</code>.
      </div>`;
      return;
    }
    allLibs = libs.map(name => ({ name, count: '…', profiles: null }));
    if (libs.length > 6) searchEl.classList.remove('hidden');
    renderLibList('');
    // Fetch all profiles in parallel (needed for aggregation)
    await Promise.all(libs.map((name, i) =>
      fetch(`/api/profiles/${encodeURIComponent(name)}`).then(r => r.json()).then(ps => {
        allLibs[i].profiles = ps;
        allLibs[i].count = ps.length;
        renderLibList(searchEl.value);
      }).catch(() => { allLibs[i].count = '?'; })
    ));
  } catch {
    listEl.innerHTML = '<span class="msg-full">Failed to load libraries.</span>';
  }
}

function enterLibrary(name, ps) {
  profiles = ps; visible = PAGE_SIZE; query = ''; selected = null; currentLibrary = name;
  document.getElementById('search').value = '';
  document.getElementById('picker').classList.add('hidden');
  document.getElementById('tracks').classList.remove('hidden');
  document.getElementById('mixer').classList.remove('hidden');
  document.getElementById('search').classList.remove('hidden');
  document.getElementById('stats').classList.remove('hidden');
  document.getElementById('lib-crumb').classList.remove('hidden');
  document.getElementById('lib-crumb-name').textContent = name;
  document.getElementById('detail-empty').classList.remove('hidden');
  document.getElementById('detail-content').classList.add('hidden');
  // Re-draw knobs now that mixer is visible (canvas dimensions resolve after display)
  ['a', 'b'].forEach(id => {
    ['hi', 'mid', 'lo'].forEach(band => {
      const canvas = document.getElementById(`deck-${id}-${band}`);
      if (canvas) drawKnob(canvas, knobState[`${id}-${band}`] ?? 0, id);
    });
  });
  render();
}

function showPicker() {
  // Stop both decks
  ['a','b'].forEach(id => {
    if (decks[id].audio) { decks[id].audio.pause(); decks[id].audio.src = ''; decks[id].audio = null; decks[id].src = null; }
  });
  document.getElementById('tracks').classList.add('hidden');
  document.getElementById('mixer').classList.add('hidden');
  document.getElementById('search').classList.add('hidden');
  document.getElementById('stats').classList.add('hidden');
  document.getElementById('lib-crumb').classList.add('hidden');
  document.getElementById('picker').classList.remove('hidden');
  loadLibraries();
}

// ── Listeners ──
document.querySelectorAll('.col-hdr').forEach(h => {
  h.addEventListener('click', () => {
    if (sortKey === h.dataset.sort) {
      sortAsc = !sortAsc;
    } else {
      sortKey = h.dataset.sort;
      sortAsc = new Set(['artist','title','camelot']).has(sortKey);
    }
    updateColHeaders();
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  visible = PAGE_SIZE;
  render();
});

document.getElementById('change-lib').addEventListener('click', showPicker);
document.getElementById('back-btn').addEventListener('click', closeDetail);
document.getElementById('lib-search').addEventListener('input', e => renderLibList(e.target.value));


// ── Mixer controls ──
document.getElementById('xfader').addEventListener('input', applyXfader);
document.getElementById('xfader-reset').addEventListener('click', () => {
  document.getElementById('xfader').value = 50;
  applyXfader();
});

// Init knobs on page load (so they draw before any track is loaded)
['a', 'b'].forEach(id => {
  ['hi', 'mid', 'lo'].forEach(band => {
    const canvas = document.getElementById(`deck-${id}-${band}`);
    if (canvas) initKnob(canvas, id, band);
  });
});

// ── Mobile EQ/Tempo modal ──
let modalDeckId = null;

// Modal EQ knobs (larger, 52px) — mirror changes to deck's real knobs
function initModalKnob(canvas, band) {
  let startY = null, startDb = null;
  function onMove(clientY) {
    const dy = startY - clientY;
    const db = Math.round((startDb + dy * 0.20) * 2) / 2;
    // Update the actual deck band
    if (modalDeckId) setEqBand(modalDeckId, band, db);
    // Sync modal display
    syncModalToDecks();
  }
  canvas.addEventListener('mousedown', e => {
    startY = e.clientY; startDb = modalDeckId ? (knobState[`${modalDeckId}-${band}`] ?? 0) : 0;
    e.preventDefault();
    const up = () => { startY = null; window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    const mv = e => { if (startY !== null) onMove(e.clientY); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });
  canvas.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY; startDb = modalDeckId ? (knobState[`${modalDeckId}-${band}`] ?? 0) : 0;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    if (startY !== null) onMove(e.touches[0].clientY); e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', () => { startY = null; });
  canvas.addEventListener('dblclick', () => { if (modalDeckId) setEqBand(modalDeckId, band, 0); syncModalToDecks(); });
}

function syncModalToDecks() {
  if (!modalDeckId) return;
  ['hi', 'mid', 'lo'].forEach(band => {
    const db = knobState[`${modalDeckId}-${band}`] ?? 0;
    const canvas = document.getElementById(`modal-${band}`);
    if (canvas) drawKnob(canvas, db, modalDeckId);
    const valEl = document.getElementById(`modal-${band}-val`);
    if (valEl) {
      const isKill = db <= EQ_MIN;
      valEl.textContent = isKill ? 'kill' : db === 0 ? '0' : db > 0 ? '+' + db : String(db);
      valEl.style.color = isKill ? '#d44e4e' : db !== 0 ? 'var(--text)' : 'var(--t2)';
    }
  });
  // BPM display
  const d = decks[modalDeckId];
  const bpmEl = document.getElementById('deck-modal-bpm');
  if (d.bpm && d.audio) {
    const eff = (d.bpm * d.audio.playbackRate).toFixed(1);
    bpmEl.textContent = eff;
    bpmEl.style.color = Math.abs(d.audio.playbackRate - 1) > 0.001 ? 'var(--accent)' : 'var(--t2)';
  } else {
    bpmEl.textContent = '—'; bpmEl.style.color = 'var(--t2)';
  }
  // Tempo slider
  const sl = document.getElementById('deck-modal-tempo-slider');
  if (d.audio) sl.value = d.audio.playbackRate; else sl.value = 1;
  // Sync/rst buttons
  const hasOtherBpm = decks[modalDeckId === 'a' ? 'b' : 'a'].bpm != null;
  document.getElementById('deck-modal-sync').disabled = !d.bpm || !hasOtherBpm;
  document.getElementById('deck-modal-rst').disabled = !d.audio;
}

function openDeckModal(id) {
  modalDeckId = id;
  const overlay = document.getElementById('deck-modal-overlay');
  const label = id === 'a' ? 'A' : 'B';
  document.getElementById('deck-modal-title').textContent = `Deck ${label} — EQ & Tempo`;
  document.getElementById('deck-modal-title').style.color = id === 'a' ? '#4e9fd4' : '#c47ed4';
  syncModalToDecks();
  overlay.classList.add('open');
}

function closeDeckModal() {
  document.getElementById('deck-modal-overlay').classList.remove('open');
  modalDeckId = null;
}

// init modal knobs
['hi', 'mid', 'lo'].forEach(band => {
  const canvas = document.getElementById(`modal-${band}`);
  if (canvas) initModalKnob(canvas, band);
});

document.getElementById('deck-modal-close').addEventListener('click', closeDeckModal);
document.getElementById('deck-modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('deck-modal-overlay')) closeDeckModal();
});

document.getElementById('deck-modal-tempo-slider').addEventListener('input', e => {
  if (!modalDeckId || !decks[modalDeckId].audio) return;
  decks[modalDeckId].audio.playbackRate = parseFloat(e.target.value);
  // Also update the real deck's tempo slider for consistency
  const realTempo = document.getElementById(`deck-${modalDeckId}-tempo`);
  if (realTempo) realTempo.value = e.target.value;
  updateBpmDisplay(modalDeckId);
  syncModalToDecks();
});

document.getElementById('deck-modal-sync').addEventListener('click', () => {
  if (!modalDeckId) return;
  syncDeck(modalDeckId);
  syncModalToDecks();
});

document.getElementById('deck-modal-rst').addEventListener('click', () => {
  if (!modalDeckId) return;
  resetDeckBpm(modalDeckId);
  syncModalToDecks();
});

// Gear buttons
document.getElementById('deck-a-settings').addEventListener('click', () => openDeckModal('a'));
document.getElementById('deck-b-settings').addEventListener('click', () => openDeckModal('b'));

updateColHeaders();
loadLibraries();
</script>
</body>
</html>
